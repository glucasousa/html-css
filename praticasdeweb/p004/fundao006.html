<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Junção de tudo</title>

    <style>
        body, html { /* para cards*/
            height: 100%;
            background: black url("imagens/wallpaper002.jpg") center center no-repeat fixed;
            background-size: cover;
            position: relative;
        }

        main { /* o card em si */
            text-align: center; 
            background-image: url("imagens/pattern004.png");
            background-repeat: repeat;
            background-position: center top;
            border: 1px solid black;
            max-width: 400px;
            max-height: 500px;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border-radius: 20px;
        }
    </style>
</head>
<body>
    <main>
        <img src="https://cdn-icons-png.flaticon.com/512/12225/12225881.png" title="Foto de perfil" alt="Foto de Perfil" width="100px"
        >
        <h1>isto e um teste para ser um cardinho</h1>
        <p>aiaiaiai</p>
    </main>
</body>
</html>
