<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vídeos</title>
</head>
<body>
    <h1>Inserindo vídeos hospedados localmente</h1>
    <p>Este vídeo está hospedado no meu próprio "servidor".</p>
    <video controls poster="imagens/limoes-capa.png" width="300px">
        <source src="midia/meu-video.mp4" type="video/mp4">
        <source src="midia/meu-video.m4v" type="video/mp4">
        <source src="midia/meu-video.ogv" type="video/ogv">
        <source src="midia/meu-video.webm" type="video/webm">

        <p>s seu navegador nao suporta</p>
    </video>

    <h2>OUtras formas</h2>
    <p>iframes, pelo youtube, ou pelo seu propio servidor</p>
</body>
</html>
