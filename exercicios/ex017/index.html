<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fontes em CSS</title>

    <style>
        @font-face {
            font-family: "fonte01";
            src: url('littlebird.tff') format('truetype')
        }
        h1#padrao {
            font-family: Arial, Helvetica, sans-serif;
        }

        h1#google {
            font-family: 'Pacifico';
        }

        h1#local {
            font-family: 'fonte01';
        }
    </style>
</head>
<body>
    <h1>Fontes em CSS</h1>
    <h1 id="padrao">Podemos configurar fontes padrão do sistema</h1>
    <h1 id="google">Ou então usar uma fonte do Google Fonts</h1>
    <h1 id="local">Ou ainda usar um arquivo local de fontes</h1>
</body>
</html>
