<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tags em html</title>
</head>
<body>
    <h1>tags em html</h1>
    <p>tem varias tags com abbr e e elementos em ul, is for learn</p>
    <ul>
        <li><abbr title="Paragrafos, use <p>">Paragrafos</abbr></li>
        <li><abbr title="titulos, use <h1> ate <h6>">Titulos</abbr></li>
        <li><abbr title="imagens, use <img src=documento">Imagens</abbr></li>
        <li><abbr title="Abreviacoes, use abbr">Abreviacoes</abbr></li>
        <li><abbr title="codigo fonte, use <pre> + <code>">Codigos</abbr></li>
        <li><abbr title="listas numeradas, use o ol com type em 1">Listas numeradas</abbr></li>
        <li><abbr title="lista com demacadores, use a lista dl com dt,e dd">Listas com demarcdores</abbr></li>
    </ul>
</body>
</html>
